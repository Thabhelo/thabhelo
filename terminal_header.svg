<svg width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="terminal-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur5" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur10" />
      <feMerge>
        <feMergeNode in="blur5" />
        <feMergeNode in="blur10" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="100%" height="1" fill="#000" opacity="0.4" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0D1117" />
  <rect width="100%" height="100%" fill="url(#scanlines)" />
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" 
        font-family="'Fira Code', monospace" font-weight="bold" font-size="70" 
        fill="#39FF14" filter="url(#terminal-glow)" letter-spacing="-2">
    THABHELO
    <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1" />
  </text>
  <text x="50%" y="80%" text-anchor="middle" font-family="monospace" font-size="14" fill="#39FF14" opacity="0.7">
    [ SYSTEM :: ONLINE ]
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1s" repeatCount="indefinite" />
  </text>
</svg>
